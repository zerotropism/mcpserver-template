[project]
name = "mcpserver-template"
version = "0.0.0"
description = "Copier template for FastMCP servers with injected persistence"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "copier>=9.18",
    "fastmcp>=4,<5",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
